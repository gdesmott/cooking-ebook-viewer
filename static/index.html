<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cookbook Library</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">🥕 Cookbook Library</a>
  <form class="searchbox" id="searchform" autocomplete="off">
    <input type="search" id="q" placeholder="Search recipes and ingredients — try “chickpea harissa”">
  </form>
  <nav class="navlinks">
    <a href="#/">Books</a>
    <a href="#/recipes">Recipes</a>
    <a href="#/favorites">Favourites</a>
    <a href="#/history">History</a>
    <a href="#/tags">Tags</a>
  </nav>
  <!-- Outside .navlinks on purpose: that whole nav is display:none below 820px,
       and signing out must not disappear with it. -->
  <form method="post" action="/logout" class="signout">
    <span id="whoami"></span>
    <button type="submit">Sign out</button>
  </form>
</header>
<main id="view"></main>
<!-- Phone navigation. .navlinks has no room below 820px, so the same five
     destinations live in a bottom bar there; this is hidden on desktop. -->
<nav class="tabbar">
  <a href="#/">Books</a>
  <a href="#/recipes">Recipes</a>
  <a href="#/favorites">Favourites</a>
  <a href="#/history">History</a>
  <a href="#/tags">Tags</a>
</nav>
<script src="/app.js"></script>
</body>
</html>
