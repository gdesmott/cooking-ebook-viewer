<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Cookbook Library</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥕</text></svg>">
<style>
:root {
  --bg: #fbfaf7; --panel: #fff; --text: #23201c; --muted: #7a736a;
  --line: #e6e1d8; --accent: #b4541f; --accent-soft: #fdf1e7;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171614; --panel: #211f1c; --text: #ece7df; --muted: #9d958a;
    --line: #34302b; --accent: #e8894f; --accent-soft: #2c231c;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
  font: 15px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  background: var(--bg); color: var(--text);
}
.card {
  width: 100%; max-width: 22rem; padding: 1.8rem;
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  box-shadow: 0 1px 2px rgba(30,25,20,.06), 0 10px 30px rgba(30,25,20,.08);
}
h1 { font-size: 1.2rem; margin: 0 0 .3rem; letter-spacing: -.01em; }
p.sub { color: var(--muted); font-size: .87rem; margin: 0 0 1.4rem; }
label { display: block; font-size: .8rem; color: var(--muted); margin: 0 0 .3rem; }
input {
  width: 100%; padding: .5rem .7rem; margin-bottom: .9rem; font: inherit;
  color: var(--text); background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
}
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
button {
  width: 100%; padding: .55rem; font: inherit; font-weight: 600; cursor: pointer;
  color: #fff; background: var(--accent); border: 0; border-radius: 999px;
}
button:hover { filter: brightness(1.06); }
.error {
  background: var(--accent-soft); color: var(--accent); font-size: .85rem;
  padding: .5rem .7rem; border-radius: 8px; margin-bottom: 1rem;
}
</style>
</head>
<body>
<form class="card" method="post" action="/login">
  <h1>🥕 Cookbook Library</h1>
  <p class="sub">Sign in to browse the collection.</p>
  <!--ERROR-->
  <label for="u">Username</label>
  <input id="u" name="username" autocomplete="username" autofocus required>
  <label for="p">Password</label>
  <input id="p" name="password" type="password" autocomplete="current-password" required>
  <input type="hidden" name="next" value="<!--NEXT-->">
  <button type="submit">Sign in</button>
</form>
</body>
</html>
